<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity WMS</title>
    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="/public/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/src/css/style.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <header class="bg-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <button id="btn-inapoi" class="hidden bg-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-600 transition">
            ← Înapoi
        </button>
        <h1 id="titlu-aplicatie" class="text-xl font-bold tracking-wide text-center flex-1">
            Antigravity Gestiune
        </h1>
        <div id="status-retea" class="w-3 h-3 rounded-full bg-green-500 shadow-lg" title="Online"></div>
    </header>

    <main class="p-4 max-w-md mx-auto">

        <section id="ecran-gestiuni" class="space-y-4 pt-4">
            <button class="card-gestiune bg-gradient-to-br from-blue-600 to-indigo-700 w-full p-8 rounded-2xl shadow-xl text-2xl font-bold tracking-wider active:scale-95 transition transform" data-gestiune="2">
                CRPV
            </button>
            <button class="card-gestiune bg-gradient-to-br from-emerald-600 to-teal-700 w-full p-8 rounded-2xl shadow-xl text-2xl font-bold tracking-wider active:scale-95 transition transform" data-gestiune="1">
                MĂNĂSTIRE
            </button>
        </section>

        <section id="ecran-locatii" class="hidden grid grid-cols-2 gap-4 pt-2">
        </section>

        <section id="ecran-produse" class="hidden space-y-4">
            <div class="relative">
                <input type="text" id="cautare-rapida" placeholder="Caută produs (ex: făină, mănuși)..."
                       class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition shadow-inner">
            </div>

            <div id="grid-produse" class="grid grid-cols-2 gap-4">
            </div>

            <button id="btn-adauga-produs-nou" class="w-full bg-gray-800 border-2 border-dashed border-gray-700 text-gray-400 py-4 rounded-xl font-semibold hover:border-gray-500 hover:text-gray-200 transition">
                + Adaugă Produs Nou în Ghid
            </button>
        </section>

        <section id="ecran-operatie" class="hidden bg-gray-800 p-5 rounded-2xl shadow-2xl space-y-4 border border-gray-700">
            <div class="flex items-center space-x-4">
                <div id="detaliu-poza-produs" class="w-20 h-20 bg-gray-700 rounded-xl overflow-hidden shadow-md bg-cover bg-center"></div>
                <div>
                    <h3 id="detaliu-nume-produs" class="text-lg font-bold">Denumire Produs</h3>
                    <p id="detaliu-marca-produs" class="text-sm text-gray-400">Marcă</p>
                    <p id="detaliu-stoc-actual" class="text-sm text-blue-400 font-semibold mt-1">Stoc actual: 0 Buc</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button id="op-intrare" class="bg-green-600/20 border border-green-500 text-green-400 font-bold py-3 rounded-xl active:bg-green-600/40 transition">
                    + INTRARE (NIR)
                </button>
                <button id="op-iesire" class="bg-red-600/20 border border-red-500 text-red-400 font-bold py-3 rounded-xl active:bg-red-600/40 transition">
                    - IEȘIRE (Consum)
                </button>
            </div>

            <div id="zona-introducere-date" class="hidden space-y-3 pt-2 border-t border-gray-700">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">CANTITATE</label>
                    <input type="number" id="input-cantitate" step="0.01" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 font-bold text-xl text-center text-white">
                </div>
                <div id="camp-expirare" class="hidden">
                    <label class="block text-xs font-semibold text-gray-400 mb-1">DATA EXPIRĂRII (Opțional)</label>
                    <input type="date" id="input-expirare" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white">
                </div>
                <button id="btn-valideaza-miscare" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition">
                    Validează Mișcarea
                </button>
            </div>
        </section>

    </main>

    <script type="module" src="/src/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/public/sw.js')
                    .then(reg => console.log('Service Worker activat cu succes!'))
                    .catch(err => console.error('Eroare Service Worker:', err));
            });
        }
    </script>
</body>
</html>
