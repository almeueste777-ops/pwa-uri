<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity WMS</title>
    <meta name="theme-color" content="#e0e5ec">
    <!-- Instalare PWA pe iOS (Safari nu citește manifest.json pentru "Add to Home Screen") -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Antigravity">
    <link rel="apple-touch-icon" href="./public/icons/icon-192.png">
    <link rel="manifest" href="./public/manifest.json">
    <link rel="stylesheet" href="./src/css/style.css">
</head>
<body class="font-sans">

    <header class="p-4 flex justify-between items-center sticky top-0 z-50 neu-card mx-4 mt-4 mb-2 sm:mx-6 sm:mt-6 md:max-w-3xl lg:max-w-5xl md:mx-auto">
        <button id="btn-inapoi" class="hidden neu-btn-circular w-10 h-10 flex items-center justify-center text-gray-500 flex-shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 id="titlu-aplicatie" class="text-lg font-bold tracking-wide text-center flex-1 truncate">
            Selectează Gestiunea
        </h1>
        <div class="flex items-center gap-3 flex-shrink-0">
            <span id="utilizator-curent" class="text-xs text-gray-500 font-semibold hidden"></span>
            <div id="status-retea" class="w-3 h-3 rounded-full bg-green-500 shadow-md flex-shrink-0" title="Online"></div>
        </div>
    </header>

    <main class="p-4 sm:p-6 w-full sm:max-w-xl md:max-w-3xl lg:max-w-5xl xl:max-w-6xl mx-auto">

        <section id="ecran-login" class="neu-card p-6 space-y-4 sm:max-w-md mx-auto">
            <h2 class="text-lg font-bold text-center mb-2">Selectează rolul și introdu PIN-ul</h2>
            <div id="lista-roluri" class="grid grid-cols-2 gap-3"></div>
            <input type="password" id="input-pin-login" inputmode="numeric" placeholder="PIN" class="w-full rounded-xl p-3 text-center text-xl font-bold hidden">
            <button id="btn-confirma-login" class="neu-btn-circular w-full text-blue-500 font-bold py-4 transition hidden">Intră în aplicație</button>
            <p id="eroare-login" class="text-rose-500 text-sm text-center hidden">PIN incorect.</p>
        </section>

        <section id="ecran-gestiuni" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4">
        </section>

        <section id="ecran-locatii" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pt-2">
        </section>

        <section id="ecran-produse" class="hidden space-y-4">
            <div class="neu-card p-1 rounded-full flex items-center px-4 mb-2 sm:max-w-md">
                <svg class="w-5 h-5 text-gray-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="cautare-rapida" placeholder="Caută produs (ex: făină, mănuși)..."
                       class="w-full py-3 bg-transparent border-none shadow-none placeholder-gray-400 transition">
            </div>

            <div id="grid-produse" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
            </div>

            <button id="btn-adauga-produs-nou" class="neu-card w-full sm:max-w-md text-gray-500 py-4 font-semibold transition">
                + Adaugă Produs Nou în Ghid
            </button>
        </section>

        <section id="ecran-operatie" class="hidden neu-card p-5 space-y-4 sm:max-w-md md:mx-auto">
            <div class="flex items-start space-x-4">
                <div class="relative flex-shrink-0">
                    <div id="detaliu-poza-produs" class="w-20 h-20 neu-icon-badge overflow-hidden bg-cover bg-center"></div>
                    <button id="btn-schimba-poza" title="Adaugă/schimbă poza" class="neu-btn-circular w-7 h-7 flex items-center justify-center text-gray-500 absolute -bottom-1 -right-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </button>
                    <input type="file" id="input-poza-fisier" accept="image/*" class="hidden">
                </div>
                <div class="flex-1 min-w-0">
                    <h3 id="detaliu-nume-produs" class="text-lg font-bold">Denumire Produs</h3>
                    <p id="detaliu-marca-produs" class="text-sm text-gray-500">Marcă</p>
                    <p id="detaliu-stoc-actual" class="text-sm text-blue-500 font-semibold mt-1">Stoc rămas: 0 Buc</p>
                    <p id="detaliu-inventar-info" class="text-xs text-gray-400 mt-0.5"></p>
                    <p id="detaliu-ultima-operatiune" class="text-xs text-gray-400 mt-0.5"></p>
                </div>
                <button id="btn-editeaza-produs" title="Editează produs" class="neu-btn-circular w-9 h-9 flex items-center justify-center text-gray-500 flex-shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button id="op-intrare" class="neu-card text-green-600 font-bold py-3 transition">
                    + INTRARE (NIR)
                </button>
                <button id="op-iesire" class="neu-card text-rose-500 font-bold py-3 transition">
                    - IEȘIRE (Consum)
                </button>
            </div>

            <div class="neu-card p-3 space-y-2">
                <label class="block text-xs font-semibold text-gray-500">INVENTARIERE (stoc existent constatat)</label>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="input-stoc-inventar" step="0.01" placeholder="Stoc existent" class="w-full rounded-xl p-3 text-center">
                    <input type="date" id="input-data-inventar" class="w-full rounded-xl p-3">
                </div>
                <button id="btn-salveaza-inventar" class="neu-btn-circular w-full text-amber-600 font-bold py-3 transition">
                    Salvează Inventarul
                </button>
            </div>

            <div id="zona-introducere-date" class="hidden space-y-3 pt-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">CANTITATE</label>
                    <input type="number" id="input-cantitate" step="0.01" class="w-full rounded-xl p-3 font-bold text-xl text-center">
                </div>
                <div id="camp-expirare" class="hidden">
                    <label class="block text-xs font-semibold text-gray-500 mb-1">DATA EXPIRĂRII (Opțional)</label>
                    <input type="date" id="input-expirare" class="w-full rounded-xl p-3">
                </div>
                <button id="btn-valideaza-miscare" class="neu-btn-circular w-full text-blue-500 font-bold py-4 transition">
                    Validează Mișcarea
                </button>
            </div>

            <button id="btn-deschide-registru" class="neu-card w-full text-gray-600 font-bold py-4 transition flex items-center justify-center gap-2">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                Deschide Registrul de Mișcări
            </button>
        </section>

        <section id="ecran-registru" class="hidden space-y-4">
            <div class="neu-card p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <button id="registru-luna-prev" class="neu-btn-circular w-9 h-9 flex items-center justify-center text-gray-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <span id="registru-luna-eticheta" class="font-bold text-base"></span>
                    <button id="registru-luna-next" class="neu-btn-circular w-9 h-9 flex items-center justify-center text-gray-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
                <div class="flex items-center gap-3">
                    <label class="text-xs font-semibold text-gray-500 whitespace-nowrap">STOC INIȚIAL LUNĂ</label>
                    <input type="number" id="registru-stoc-initial" step="0.01" class="flex-1 rounded-xl p-2 text-center font-bold">
                </div>
                <p id="registru-info" class="text-xs text-gray-400"></p>
            </div>

            <div class="neu-card p-2">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="text-gray-400 text-left">
                                <th class="py-2 px-2 font-semibold">Ziua</th>
                                <th class="py-2 px-2 font-semibold text-center">Intrare</th>
                                <th class="py-2 px-2 font-semibold text-center">Ieșire</th>
                                <th class="py-2 px-2 font-semibold text-right">Înainte</th>
                                <th class="py-2 px-2 font-semibold text-right">După</th>
                            </tr>
                        </thead>
                        <tbody id="corp-registru"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <div id="modal-editare" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4" style="background:rgba(0,0,0,0.35)">
            <div class="neu-card p-5 space-y-3 w-full max-w-sm">
                <h3 class="font-bold text-center">Editează produsul</h3>
                <div class="flex items-center space-x-3">
                    <div class="relative flex-shrink-0">
                        <div id="edit-poza" class="w-16 h-16 neu-icon-badge overflow-hidden bg-cover bg-center"></div>
                        <button id="edit-btn-poza" title="Adaugă/schimbă poza" class="neu-btn-circular w-7 h-7 flex items-center justify-center text-gray-500 absolute -bottom-1 -right-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                        <input type="file" id="edit-input-poza" accept="image/*" class="hidden">
                    </div>
                    <p class="flex-1 text-xs text-gray-500">Apasă pe cameră ca să adaugi sau schimbi poza produsului.</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">DENUMIRE</label>
                    <input id="edit-nume" class="w-full rounded-xl p-3">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">MARCĂ</label>
                        <input id="edit-marca" class="w-full rounded-xl p-3">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">UNITATE</label>
                        <input id="edit-unitate" class="w-full rounded-xl p-3">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">CANTITATE (stoc)</label>
                    <input type="number" id="edit-cantitate" step="0.01" class="w-full rounded-xl p-3 text-center font-bold">
                </div>
                <div class="grid grid-cols-2 gap-3 pt-1">
                    <button id="edit-salveaza" class="neu-btn-circular text-blue-500 font-bold py-3 transition">Salvează</button>
                    <button id="edit-anuleaza" class="neu-card text-gray-500 font-bold py-3 transition">Anulează</button>
                </div>
                <button id="edit-sterge" class="w-full text-rose-500 text-sm font-semibold py-2 transition">Șterge produsul</button>
            </div>
        </div>

    </main>

    <script type="module" src="./src/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            // Când un Service Worker nou preia controlul (după o actualizare), reîncărcăm
            // pagina o singură dată ca să rulăm imediat codul proaspăt, nu cel din cache.
            let reincarcat = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (reincarcat) return;
                reincarcat = true;
                window.location.reload();
            });

            window.addEventListener('load', () => {
                // sw.js stă la rădăcina site-ului ca să poată controla tot (scope implicit = '/').
                // Dacă ar fi în /public/, scope-ul implicit ar fi /public/ și SW-ul nu ar mai
                // putea servi offline pagina principală index.html.
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('Service Worker activat cu succes!');
                        reg.update();
                    })
                    .catch(err => console.error('Eroare Service Worker:', err));
            });
        }
    </script>
</body>
</html>
