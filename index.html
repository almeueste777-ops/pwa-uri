<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity WMS</title>
    <meta name="theme-color" content="#e0e5ec">
    <!-- Instalare PWA pe iOS (Safari nu citește manifest.json pentru "Add to Home Screen") -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Antigravity">
    <link rel="apple-touch-icon" href="./public/icons/icon-192.png">
    <link rel="manifest" href="./public/manifest.json">
    <link rel="stylesheet" href="./src/css/style.css">
</head>
<body class="font-sans">

    <header class="p-4 flex justify-between items-center sticky top-0 z-50 neu-card mx-4 mt-4 mb-2 sm:mx-6 sm:mt-6 md:max-w-3xl lg:max-w-5xl md:mx-auto">
        <button id="btn-inapoi" class="hidden neu-btn-circular w-10 h-10 flex items-center justify-center text-gray-500 flex-shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 id="titlu-aplicatie" class="text-lg font-bold tracking-wide text-center flex-1 truncate">
            Selectează Gestiunea
        </h1>
        <div id="status-retea" class="w-3 h-3 rounded-full bg-green-500 shadow-md flex-shrink-0" title="Online"></div>
    </header>

    <main class="p-4 sm:p-6 w-full sm:max-w-xl md:max-w-3xl lg:max-w-5xl xl:max-w-6xl mx-auto">

        <section id="ecran-gestiuni" class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4">
        </section>

        <section id="ecran-locatii" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pt-2">
        </section>

        <section id="ecran-produse" class="hidden space-y-4">
            <div class="neu-card p-1 rounded-full flex items-center px-4 mb-2 sm:max-w-md">
                <svg class="w-5 h-5 text-gray-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="cautare-rapida" placeholder="Caută produs (ex: făină, mănuși)..."
                       class="w-full py-3 bg-transparent border-none shadow-none placeholder-gray-400 transition">
            </div>

            <div id="grid-produse" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
            </div>

            <button id="btn-adauga-produs-nou" class="neu-card w-full sm:max-w-md text-gray-500 py-4 font-semibold transition">
                + Adaugă Produs Nou în Ghid
            </button>
        </section>

        <section id="ecran-operatie" class="hidden neu-card p-5 space-y-4 sm:max-w-md md:mx-auto">
            <div class="flex items-center space-x-4">
                <div id="detaliu-poza-produs" class="w-20 h-20 neu-icon-badge overflow-hidden bg-cover bg-center flex-shrink-0"></div>
                <div>
                    <h3 id="detaliu-nume-produs" class="text-lg font-bold">Denumire Produs</h3>
                    <p id="detaliu-marca-produs" class="text-sm text-gray-500">Marcă</p>
                    <p id="detaliu-stoc-actual" class="text-sm text-blue-500 font-semibold mt-1">Stoc actual: 0 Buc</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button id="op-intrare" class="neu-card text-green-600 font-bold py-3 transition">
                    + INTRARE (NIR)
                </button>
                <button id="op-iesire" class="neu-card text-rose-500 font-bold py-3 transition">
                    - IEȘIRE (Consum)
                </button>
            </div>

            <div id="zona-introducere-date" class="hidden space-y-3 pt-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">CANTITATE</label>
                    <input type="number" id="input-cantitate" step="0.01" class="w-full rounded-xl p-3 font-bold text-xl text-center">
                </div>
                <div id="camp-expirare" class="hidden">
                    <label class="block text-xs font-semibold text-gray-500 mb-1">DATA EXPIRĂRII (Opțional)</label>
                    <input type="date" id="input-expirare" class="w-full rounded-xl p-3">
                </div>
                <button id="btn-valideaza-miscare" class="neu-btn-circular w-full text-blue-500 font-bold py-4 transition">
                    Validează Mișcarea
                </button>
            </div>
        </section>

    </main>

    <script type="module" src="./src/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // sw.js stă la rădăcina site-ului ca să poată controla tot (scope implicit = '/').
                // Dacă ar fi în /public/, scope-ul implicit ar fi /public/ și SW-ul nu ar mai
                // putea servi offline pagina principală index.html.
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker activat cu succes!'))
                    .catch(err => console.error('Eroare Service Worker:', err));
            });
        }
    </script>
</body>
</html>
